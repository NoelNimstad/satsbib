	</header>
	<main>
		<section>
			<h3>Formulering</h3>
			<p>
				Utveckingen av binomet \( x+y \) upphöjt till något \( n\in\mathbb{N} \) ges av summan:
				$$
					(x+y)^n=\sum_{k=0}^nx^{n-k}y^{k}
				$$
			</p>
