	</header>
	<h3>Formulering</h3>
	<p>
		Om \( f\in\mathcal{C}([a,b]) \), då \( \exists m,M\in[a,b] \) s.a.:
		$$
			f(m)\leq f(x)\leq f(M)
		$$
	</p>
	<p class="notice">
		Detta innebär att om \( f \) är en kontinuerlig funktion på ett interval, så når \( f \) sitt minimi- och maximivärde.
	</p>
